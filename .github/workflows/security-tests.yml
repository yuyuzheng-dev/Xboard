name: Security checks

on:
  pull_request:
    branches: [master]
  push:
    branches: ["security/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.2 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, redis, pcntl, fileinfo, bcmath, zip
          coverage: none
          tools: composer:v2
      - name: Validate locked dependencies
        run: |
          composer validate --no-check-publish
          composer audit --locked
      - name: Install test dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: PHP syntax checks
        run: |
          find app config plugins-core tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-syntax.txt
          tail -n 10 /tmp/php-syntax.txt
      - name: Regression tests
        run: ./vendor/bin/phpunit --testsuite Unit,Feature

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: xboard_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.2 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, redis, pcntl, fileinfo, bcmath, zip
          coverage: none
          tools: composer:v2
      - name: Validate locked dependencies
        run: |
          composer validate --no-check-publish
          composer audit --locked
      - name: Install test dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: MySQL integration and regression tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: xboard_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: ./vendor/bin/phpunit --testsuite Unit,Feature
