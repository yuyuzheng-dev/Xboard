name: Security checks

on:
  pull_request:
    branches: [master]
  push:
    branches: ["security/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.2 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite, redis, pcntl, fileinfo, bcmath
          coverage: none
          tools: composer:v2
      - name: Validate locked dependencies
        run: |
          composer validate --no-check-publish
          composer audit --locked --no-dev
      - name: Install test dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: PHP syntax checks
        run: |
          find app config plugins-core tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-syntax.txt
          tail -n 10 /tmp/php-syntax.txt
      - name: Regression tests
        run: php artisan test --testsuite=Unit,Feature
